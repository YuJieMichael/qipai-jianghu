<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="七派江湖：一款原创武侠网页游戏，七大门派、主线剧情、通天塔、论剑、押镖、灵兽、转生。">
<title>七派江湖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
/* Layout: 顶部公告 + 侠客名帖 + 门签式页签 + 单栏卷面；战斗与剧情为覆盖全屏的浮层。夜色墨青底，金箔与朱砂点题，单一暗色主题 */
:root{
  --ink:#0e1416; --glow:#1b2a2b; --panel:#152022; --panel2:#1b292b; --line:#2a3a3b; --line2:#3a4c4c;
  --fg:#ebe4d1; --muted:#90a097; --dim:#6a7a73;
  --gold:#d8ad55; --gold-d:#8d6b2b; --cinnabar:#cf4a3a; --jade:#5db394; --azure:#5b94d9;
  --q0:#c8c6bb; --q1:#72cf6c; --q2:#5aa4ff; --q3:#b980ff; --q4:#ffa040;
  --s-shaolin:#c98a2e; --s-wudang:#6c9bd2; --s-emei:#d68fb0; --s-gaibang:#93a955; --s-mingjiao:#d65e40; --s-tangmen:#5fb7a1; --s-tianshan:#9cc7ea;
  --g-atk:#ff7a6a; --g-def:#6fb4ff; --g-hp:#72cf6c; --g-crit:#c08cff; --g-spd:#e8d36a;
  --f-display:"Ma Shan Zheng","STXingkai","KaiTi","STKaiti",serif;
  --f-body:"Noto Serif SC","Songti SC","SimSun","STSong",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1000px 420px at 50% -140px,var(--glow),transparent 72%),var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.65;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2,h3{font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}

/* 公告 */
.news{overflow:hidden;white-space:nowrap;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12px;color:var(--muted);padding:3px 0}
.news span{display:inline-block;padding-left:100%;animation:marq 70s linear infinite}
.news i{font-style:normal;color:var(--cinnabar);margin:0 6px 0 28px}
@keyframes marq{to{transform:translateX(-100%)}}

/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.seal{font-family:var(--f-display);background:var(--cinnabar);color:#fbeee4;width:44px;height:44px;display:grid;place-items:center;font-size:19px;line-height:1.05;border-radius:5px;text-align:center;box-shadow:inset 0 0 0 2px rgba(255,240,230,.18);transform:rotate(-4deg)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0;letter-spacing:6px;color:var(--gold);line-height:1}
.brand .sub{color:var(--muted);font-size:12px;letter-spacing:3px;margin-top:4px}
.top-r{display:flex;align-items:center;gap:10px}
.saved{font-size:12px;color:var(--dim)}
.sc-btn{background:linear-gradient(180deg,#ff6a3d,#b8291a);color:#fff3cf;border:1px solid #ffb35c;border-radius:16px;padding:4px 14px;font-weight:700;letter-spacing:1px;cursor:pointer;animation:glow 1.6s ease-in-out infinite;white-space:nowrap}
@keyframes glow{50%{box-shadow:0 0 14px #ff8a3d}}

/* 名帖 */
.card{display:grid;grid-template-columns:auto 1fr auto;gap:14px 18px;align-items:center;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:30px;color:var(--ink);background:var(--sc,var(--gold));box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--sc,var(--gold))}
.who{min-width:0}
.who .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.who .nm b{font-size:19px}
.ttl{font-size:12px;color:var(--q4);border:1px solid currentColor;border-radius:3px;padding:0 6px;line-height:1.6}
.rb{font-size:12px;color:var(--cinnabar);font-weight:700}
.tag{font-size:12px;color:var(--muted);letter-spacing:1px}
.lvline{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin:4px 0;font-variant-numeric:tabular-nums}
.lvline b{color:var(--fg);font-size:14px}
.power{text-align:right}
.power .lbl{display:block;font-size:11px;letter-spacing:3px;color:var(--muted)}
.power b{font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.res{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:10px 0 0;border-top:1px dashed var(--line);list-style:none;font-size:13px;font-variant-numeric:tabular-nums}
.res li span{color:var(--muted);margin-right:6px}

.bar{height:8px;background:#0a1011;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;transition:width .3s ease}
.bar.exp i{background:linear-gradient(90deg,var(--gold-d),var(--gold))}
.bar.hp i{background:linear-gradient(90deg,#8e2a20,var(--cinnabar))}
.bar.mp i{background:linear-gradient(90deg,#2d5689,var(--azure))}
.bar.jade i{background:linear-gradient(90deg,#2f6d58,var(--jade))}

/* 页签 */
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px 8px;cursor:pointer;color:var(--muted);font-size:15px;letter-spacing:2px;position:relative}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.badge{position:absolute;top:2px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--cinnabar);color:#fff;font-size:10px;line-height:16px;letter-spacing:0;font-family:system-ui,sans-serif}
.dot{position:absolute;top:6px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--cinnabar)}

/* 通用 */
.panel{display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box>h3{font-size:16px;color:var(--gold);letter-spacing:2px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.box>h3 small{font-size:12px;color:var(--muted);letter-spacing:0;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line2);padding:6px 14px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--gold-d);background:#223234}
.btn.pri{background:linear-gradient(180deg,#e3b95f,#b08636);border-color:#8d6b2b;color:#1b1407;font-weight:700}
.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,#f0c76b,#bd903c)}
.btn.red{border-color:#6e2b23;color:#f0a596}
.btn.sm{padding:3px 10px;font-size:12px}
.btn.big{padding:10px 28px;font-size:17px;letter-spacing:4px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.note{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.chip.easy{color:var(--jade)} .chip.even{color:var(--gold)} .chip.hard{color:var(--cinnabar)}
.q0{color:var(--q0)} .q1{color:var(--q1)} .q2{color:var(--q2)} .q3{color:var(--q3)} .q4{color:var(--q4)}
.r1{color:var(--q1)} .r2{color:var(--q2)} .r3{color:var(--q3)} .r4{color:var(--q4)}
.empty{padding:22px 10px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.big-n{font-family:var(--f-display);font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.2;font-weight:400}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.kv>span:first-child{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cardx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);display:flex;flex-direction:column;gap:4px}
.cardx .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cardx .sh b{font-family:var(--f-display);font-weight:400;font-size:21px}
.cardx .eff{font-size:12px}
.cardx .fl{font-size:12px;color:var(--dim)}
.cardx .row{margin-top:4px}
.cardx.on{border-color:var(--gold-d)}
.cardx.off{opacity:.55}

/* 人物 */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;margin:0}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:3px 0}
.stats dt{color:var(--muted)} .stats dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600}
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.skill{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.skill .sk-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.skill .sk-h span{font-size:12px;color:var(--muted)}
.skill p{font-size:13px;color:var(--muted);margin-top:2px}
.skill.locked{opacity:.5}
.skill.secret{border-color:var(--gold-d);background:linear-gradient(180deg,#252114,var(--panel2))}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ach{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2);display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.ach b{font-size:14px;color:var(--q4);font-weight:600}
.ach.off{opacity:.45} .ach.off b{color:var(--muted)}
.ach.worn{border-color:var(--q4)}
.ach .btn{align-self:flex-start;margin-top:4px}
.sectpick{display:flex;gap:6px;flex-wrap:wrap}
.sectpick button{border:1px solid var(--line2);background:var(--panel2);border-radius:6px;padding:4px 10px;cursor:pointer}
.sectpick button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
textarea{width:100%;min-height:70px;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12px;font-family:ui-monospace,monospace;resize:vertical}

/* 江湖 */
.jh{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start}
.zones{display:flex;flex-direction:column;gap:6px}
.zone{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;text-align:left;width:100%}
.zone b{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:2px}
.zone small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.zone[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(90deg,#2a2618,var(--panel))}
.zone[aria-pressed="true"] b{color:var(--gold)}
.zone:disabled{opacity:.4;cursor:not-allowed}
.zone .pg{font-size:11px;color:var(--dim)}
.chapter{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:8px;background:#1f1d14;border:1px solid #3d3420;font-size:13px}
.chapter b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--gold);margin-right:6px}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.path li{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:8px 0;position:relative}
.path li:not(:last-child)::after{content:"";position:absolute;left:16px;top:42px;bottom:-8px;width:2px;background:var(--line)}
.path li.done:not(:last-child)::after{background:var(--gold-d)}
.node{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:var(--panel2);font-size:13px;color:var(--muted);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.done .node{border-color:var(--gold-d);color:var(--gold)}
.cur .node{border-color:var(--gold);color:var(--ink);background:var(--gold)}
.boss .node{font-family:var(--f-display);font-size:17px;border-color:var(--cinnabar);color:var(--cinnabar)}
.boss.cur .node{background:var(--cinnabar);color:#fff}
.lock{opacity:.4}
.st-info b{font-size:15px} .st-info .muted{font-size:12px}
.toggles{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px}

/* 通天塔 */
.tower-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.pagoda{width:76px;height:96px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pagoda i{display:block;height:12px;background:var(--line2);border-radius:2px}
.pagoda i.on{background:var(--gold)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{background:var(--panel2);border:1px solid var(--gold-d);border-radius:10px;padding:18px 10px;cursor:pointer;font-size:15px;text-align:center}
.pick:hover{border-color:var(--gold);background:#262414}
.buffs{display:flex;gap:6px;flex-wrap:wrap}
.buffs span{font-size:12px;padding:1px 8px;border-radius:10px;background:#2a2618;color:var(--gold);border:1px solid var(--gold-d)}

/* 修炼与经脉 */
.meditate{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.taiji{width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--fg) 0 50%,var(--ink) 0);position:relative;animation:spin 14s linear infinite;box-shadow:0 0 0 2px var(--line2)}
.taiji::before,.taiji::after{content:"";position:absolute;left:50%;width:43px;height:43px;border-radius:50%;transform:translateX(-50%)}
.taiji::before{top:0;background:radial-gradient(circle,var(--ink) 0 6px,var(--fg) 7px)}
.taiji::after{bottom:0;background:radial-gradient(circle,var(--fg) 0 6px,var(--ink) 7px)}
@keyframes spin{to{transform:rotate(360deg)}}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.trow:last-child{border-bottom:0}
.trow small{color:var(--muted);display:block;font-size:12px}
.mers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mer h3 .layer{font-family:var(--f-display);font-size:20px;color:var(--fg);font-weight:400}
.pips{display:flex;gap:4px}
.pips i{width:16px;height:5px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--gold)}
.acu{list-style:none;margin:0;padding:0 0 0 6px;display:flex;flex-direction:column}
.acu li{display:flex;align-items:center;gap:10px;padding:5px 0;position:relative;font-size:14px;color:var(--dim)}
.acu li:not(:last-child)::after{content:"";position:absolute;left:6px;top:22px;height:calc(100% - 12px);width:2px;background:var(--line)}
.acu li.on{color:var(--fg)}
.acu li.on::after{background:var(--gold-d)}
.acu li .pt{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);background:var(--ink);flex:0 0 auto;z-index:1}
.acu li.on .pt{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.acu li.next .pt{border-color:var(--gold);animation:pulse 1.4s ease-in-out infinite}
.acu li.next{color:var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(216,173,85,.18)}}

/* 武魂 */
.sslots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sslot{border:1px dashed var(--line2);border-radius:10px;padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;text-align:center}
.sslot.has{border-style:solid;background:var(--panel2)}
.sslot b{font-family:var(--f-display);font-weight:400;font-size:22px}

/* 师门 */
.task{display:grid;grid-template-columns:1fr 140px auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.task:last-child{border-bottom:0}
.task small{display:block;color:var(--muted);font-size:12px}
.task .bar{height:6px}

/* 活动 */
.route{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:12px;color:var(--dim)}
.route div{border-top:3px solid var(--line);padding-top:6px}
.route div.on{border-color:var(--gold);color:var(--fg)}
.elog{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:3px;color:var(--muted)}

/* 福利 */
.sign{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sday{border:1px solid var(--line);border-radius:8px;padding:8px 2px;text-align:center;font-size:12px;background:var(--panel2);color:var(--muted)}
.sday b{display:block;font-family:var(--f-display);font-size:18px;color:var(--gold);font-weight:400}
.sday.on{opacity:.4}
.sday.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);color:var(--fg)}
.chests{display:flex;gap:8px;flex-wrap:wrap}
.chest{width:52px;height:44px;border-radius:6px;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;color:var(--dim);background:var(--panel2)}
.chest.ready{border-color:var(--gold);color:var(--gold);background:#2a2618}
.chest.got{opacity:.35}

/* 装备 */
.forges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.forge{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2);display:flex;flex-direction:column;gap:6px;min-width:0}
.forge .fh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.forge .fh .slot-n{font-family:var(--f-display);font-size:18px;color:var(--dim)}
.forge .st{font-size:12px;color:var(--muted)}
.sock{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gem{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid currentColor;background:none;cursor:default;white-space:nowrap}
button.gem{cursor:pointer}
.g-atk{color:var(--g-atk)} .g-def{color:var(--g-def)} .g-hp{color:var(--g-hp)} .g-crit{color:var(--g-crit)} .g-spd{color:var(--g-spd)}
.sock .es{font-size:12px;color:var(--dim);border:1px dashed var(--line2);border-radius:10px;padding:1px 10px;background:none;cursor:pointer}
.gempick{border:1px dashed var(--gold-d);border-radius:8px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.reforge{border:1px solid var(--gold-d);border-radius:8px;padding:8px;background:#211e14;font-size:12px;display:flex;flex-direction:column;gap:6px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel2);display:flex;flex-direction:column;gap:3px}
.item b{font-size:15px}
.item .meta{font-size:12px;color:var(--muted)}
.item .st{font-size:12px}
.cmp{font-size:12px}
.cmp.up{color:var(--jade)} .cmp.down{color:var(--cinnabar)}

/* 奇遇与论剑 */
.event{border:1px solid var(--gold-d);border-radius:10px;padding:18px;background:linear-gradient(180deg,#221f16,var(--panel));display:flex;flex-direction:column;gap:12px}
.event h3{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--gold);letter-spacing:4px}
.event p{font-size:15px;line-height:1.9;max-width:62ch}

function meridianBonus(){
  const flat={hp:0,mp:0,atk:0,def:0,spd:0,crit:0,dodge:0};
  for(let p=0;p<S.mer.ren;p++){const c=Math.floor(p/8)+1;flat.hp+=20*c;flat.def+=2*c;flat.mp+=3*c}
  for(let p=0;p<S.mer.du;p++){const c=Math.floor(p/8)+1;flat.atk+=3*c;flat.spd+=.5*c}
  flat.dodge+=Math.floor(S.mer.ren/8);flat.crit+=Math.floor(S.mer.du/8);
  const tong=Math.min(Math.floor(S.mer.ren/8),Math.floor(S.mer.du/8));
  return {flat,pct:tong*.03,tong};
}
function soulBonus(so){const d=SOULDEF[so.id];const m=1+.3*(so.lv-1);const o={};for(const k in d.st)o[k]=d.st[k]*m;return o}
function soulTxt(b){return Object.entries(b).map(([k,v])=>isPct(k)?`${STN[k]} +${v.toFixed(1)}%`:`${STN[k]} +${(v*100).toFixed(1)}%`).join('，')}
function addTo(st,o){for(const k in o)st[k]=(st[k]||0)+o[k]}
const soulSlotOpen=i=>S.lv>=SOUL_SLOT_LV[i]||S.rb>0;
const petOpen=id=>S.lv>=PETS[id].lv||S.rb>0;
const secretOpen=()=>S.lv>=SECRET_LV||S.rb>0;
function petPassive(){const p=S.pet&&S.pets.find(x=>x.id===S.pet);if(!p)return {};const o={};for(const k in PETS[p.id].pas)o[k]=PETS[p.id].pas[k]*p.lv;return o}
function titleBonus(){const a=S.title&&ACHS.find(x=>x.id===S.title);return a?a.b:{}}
function calcStats(){
  const s=SECTS[S.sect],L=S.lv,st={},m=rbMult();
  for(const k of ['hp','mp','atk','def','spd'])st[k]=(s.base[k]+s.grow[k]*(L-1))*m;
  st.crit=s.base.crit;st.dodge=s.base.dodge;
  for(const k in TRAIN_V)st[k]+=S.train[k]*TRAIN_V[k];
  const mb=meridianBonus();addTo(st,mb.flat);
  for(const sl of SLOTS){const it=S.equip[sl];if(it)addTo(st,itemStats(it))}
  addTo(st,S.bonus);addTo(st,petPassive());addTo(st,titleBonus());
  const pct={hp:mb.pct,mp:mb.pct,atk:mb.pct,def:mb.pct,spd:mb.pct};
  S.soulSlots.forEach((u,i)=>{if(!u||!soulSlotOpen(i))return;const so=S.souls.find(x=>x.uid===u);if(!so)return;const b=soulBonus(so);for(const k in b){if(k in pct)pct[k]+=b[k];else st[k]+=b[k]}});
  for(const k in pct)st[k]*=1+pct[k];
  for(const k of ['hp','mp','atk','def'])st[k]=Math.round(st[k]);
  st.spd=Math.round(st.spd*10)/10;st.crit=Math.min(60,Math.round(st.crit*10)/10);st.dodge=Math.min(40,Math.round(st.dodge*10)/10);
  st.power=powerOf(st);
  return st;
}
function powerOf(st){let p=0;for(const k in PW)p+=(st[k]||0)*PW[k];return Math.round(p)}
function stList(st){return Object.entries(st).filter(([,v])=>v).map(([k,v])=>isPct(k)?`${STN[k]}+${(+v).toFixed(1)}%`:`${STN[k]}+${Math.round(v)}`).join(' ')}

function gainExp(e){
  const msgs=[];if(S.lv>=60){S.exp=0;return msgs}
  S.exp+=Math.round(e);
  while(S.lv<60&&S.exp>=needExp(S.lv)){
    S.exp-=needExp(S.lv);S.lv++;msgs.push(`突破至 ${S.lv} 级`);
    for(const k of SECTS[S.sect].sk)if(k.lv===S.lv)msgs.push(`习得武学「${k.n}」`);
    const si=SOUL_SLOT_LV.indexOf(S.lv);if(si>=0&&!S.rb)msgs.push(`第 ${si+1} 个武魂槽开启`);
    const mi=MER_REQ.indexOf(S.lv);if(mi>0)msgs.push(`可冲击经脉第 ${LAYER[mi]} 重`);
    if(S.lv===SECRET_LV&&!S.rb)msgs.push('可向师门求学秘传绝学');
    if(S.lv===60)msgs.push('已臻化境，可以转生');
  }
  if(S.lv>=60)S.exp=0;
  return msgs;
}

  const me=calcStats(),s=SECTS[sect],mine=SECTS[S.sect],o={};

/* ============ 战斗模拟 ============ */
function eff(f,k){
  if(k==='dodge')return f.dodge+f.buffs.reduce((s,b)=>s+(b.dodge||0),0);
  return f[k]*(1+f.buffs.reduce((s,b)=>s+(b[k]||0),0));
}
function chooseSkill(a){
  const av=a.skills.filter(k=>k.mp<=a.mp&&!(a.cds[k.n]>0));
  const heal=av.find(k=>k.heal&&a.hp/a.maxhp<.55);if(heal)return heal;
  const buff=av.find(k=>k.buff&&!k.mult&&!k.heal&&!a.buffs.some(b=>b.src===k.n));if(buff)return buff;
  const dmg=av.filter(k=>k.mult).sort((x,y)=>y.mult*(y.hits||1)-x.mult*(x.hits||1));
  return dmg[0]||null;
}
const tagsOf=f=>{const t=f.buffs.map(b=>b.src);f.dots.forEach(d=>t.push(d.l));if(f.stun)t.push('晕眩');return t};
function simulate(A,B,opt={}){
  const log=[],maxR=opt.rounds||40;
  const nm=f=>`<span class="${f.side}">${esc(f.name)}</span>`;
  const push=(text,side,fx)=>log.push({text,side,fx:fx||[],a:[A.hp,A.mp],b:[B.hp,B.mp],ta:tagsOf(A),tb:tagsOf(B)});
  const tick=f=>{f.buffs.forEach(b=>b.left--);f.buffs=f.buffs.filter(b=>b.left>0)};
  const act=(a,t)=>{
    for(const d of a.dots){a.hp=Math.max(0,a.hp-d.v);d.t--;push(`${nm(a)} ${d.l}发作，损失 <b class="d">${d.v}</b> 气血`,a.side,[{on:a.side,v:'-'+d.v,k:'dmg'}])}
    a.dots=a.dots.filter(d=>d.t>0);
    if(a.hp<=0)return;
    for(const k in a.cds)if(a.cds[k]>0)a.cds[k]--;
    if(a.stun){a.stun=false;tick(a);push(`${nm(a)} 被震晕，无法出手`,a.side);return}
    const sk=chooseSkill(a);
    if(sk){a.mp-=sk.mp;a.cds[sk.n]=sk.cd}
    const s=sk||{n:'',mult:1};
    let txt=`${nm(a)} `+(sk?`施展「<em>${s.n}</em>」`:'出招攻击');const fx=[];
    if(s.mult){
      const hits=s.hits||1,K=50+5*a.lv;let total=0,landed=0,crits=0;
      for(let i=0;i<hits;i++){
        if(Math.random()*100<Math.min(40,eff(t,'dodge')))continue;
        let d=eff(a,'atk')*s.mult*K/(K+eff(t,'def'))*R(.92,1.08);
        if(Math.random()*100<Math.min(60,a.crit+(s.crit||0))){d*=1.6;crits++}
        total+=Math.max(1,Math.round(d));landed++;
      }
      if(!landed){txt+=`，被 ${nm(t)} 闪身避过`;fx.push({on:t.side,v:'闪避',k:'miss'})}
      else{
        t.hp=Math.max(0,t.hp-total);
        txt+=(hits>1?`，${landed}/${hits} 段命中`:'')+`，造成 <b class="d">${total}</b> 点伤害`+(crits?'<span class="cr">（暴击）</span>':'');
        fx.push({on:t.side,v:'-'+total,k:crits?'crit':'dmg'});
        const stl=(s.steal||0)+(a.lsteal||0);
        if(stl){const h=Math.round(total*stl);a.hp=Math.min(a.maxhp,a.hp+h);txt+=`，吸取 <b class="h">${h}</b> 气血`}
        if(s.dot&&t.hp>0){const v=Math.max(1,Math.round(eff(a,'atk')*s.dot.k*K/(K+eff(t,'def'))));t.dots=t.dots.filter(d=>d.l!==s.dot.l);t.dots.push({v,t:s.dot.t,l:s.dot.l});txt+=`，${nm(t)} 身中${s.dot.l}`}
        if(s.stun&&t.hp>0&&Math.random()<s.stun*(t.boss?.5:1)){t.stun=true;txt+=`，${nm(t)} 被震晕`}
      }
    }
    if(s.heal){const h=Math.round(a.maxhp*s.heal);a.hp=Math.min(a.maxhp,a.hp+h);txt+=`，回复 <b class="h">${h}</b> 气血`;fx.push({on:a.side,v:'+'+h,k:'heal'})}
    if(s.buff){a.buffs=a.buffs.filter(b=>b.src!==s.n);a.buffs.push({...s.buff,src:s.n,left:s.buff.t+1});txt+=`，${s.d.split('，').filter(x=>/提升|\+/.test(x)).join('，')||'气势大涨'}`}
    a.mp=Math.min(a.maxmp,a.mp+Math.round(a.maxmp*.06));
    tick(a);push(txt,a.side,fx);
  };
  const petAct=(f,t)=>{
    const p=f.pet,K=50+5*f.lv,dm=k=>Math.max(1,Math.round(eff(f,'atk')*k*p.pw*K/(K+eff(t,'def'))));
    const who=`${nm(f)} 的${p.n}`;
    if(p.id==='hou'){const d=dm(.6);t.hp=Math.max(0,t.hp-d);push(`${who}窜上前偷袭，造成 <b class="d">${d}</b> 点伤害`,f.side,[{on:t.side,v:'-'+d,k:'dmg'}])}
    else if(p.id==='he'){const h=Math.round(f.maxhp*.06*p.pw);f.hp=Math.min(f.maxhp,f.hp+h);push(`${who}衔来草药，回复 <b class="h">${h}</b> 气血`,f.side,[{on:f.side,v:'+'+h,k:'heal'}])}
    else if(p.id==='lang'){const d=dm(.5);t.hp=Math.max(0,t.hp-d);if(t.hp>0){t.dots=t.dots.filter(x=>x.l!=='流血');t.dots.push({v:dm(.3),t:2,l:'流血'})}push(`${who}扑咬过去，造成 <b class="d">${d}</b> 点伤害，${nm(t)} 血流不止`,f.side,[{on:t.side,v:'-'+d,k:'dmg'}])}
    else if(p.id==='gui'){f.buffs=f.buffs.filter(b=>b.src!=='龟甲');f.buffs.push({def:.4,src:'龟甲',left:2});push(`${who}以龟甲护主，防御提升40%`,f.side)}
    else if(p.id==='hu'){const d=dm(.3);t.hp=Math.max(0,t.hp-d);let x='';if(t.hp>0&&Math.random()<.35*(t.boss?.5:1)){t.stun=true;x=`，${nm(t)} 神魂颠倒`}push(`${who}施展媚术，造成 <b class="d">${d}</b> 点伤害${x}`,f.side,[{on:t.side,v:'-'+d,k:'dmg'}])}
  };
  push(`${nm(A)} 与 ${nm(B)} 拉开架势……`,null);
  let round=0,winner=null;
  while(round<maxR&&!winner){
    round++;
    const order=[A,B].sort((x,y)=>(eff(y,'spd')-eff(x,'spd'))||(Math.random()-.5));
    for(const f of order){
      const t=f===A?B:A;act(f,t);
      if(t.hp<=0){winner=f;break}
      if(f.hp<=0){winner=t;break}
    }
    if(!winner)for(const f of [A,B]){
      const t=f===A?B:A;
      if(!f.pet||f.hp<=0||t.hp<=0||Math.random()>=.4)continue;
      petAct(f,t);if(t.hp<=0){winner=f;break}
    }
    if(log.length)log[log.length-1].round=round;
  }
  if(!winner){
    if(opt.wb){push(`${maxR}回合已过，${nm(B)} 退入迷雾之中。`,null);return {log,win:false,rounds:round}}
    winner=(A.hp/A.maxhp>=B.hp/B.maxhp)?A:B;push(`${maxR}回合未分胜负，以伤势轻重论输赢。`,null);
  }
  push(winner===A?`${nm(B)} 败下阵来。`:`${nm(A)} 力有不逮，败下阵来。`,null);
  return {log,win:winner===A,rounds:round};
}

/* ============ 战斗流程 ============ */
function fInfo(f){return {name:f.name,lv:f.lv,tag:f.sectN||(f.boss?'首领':f.elite?'精英':'江湖'),maxhp:f.maxhp,maxmp:f.maxmp}}
const stageLv=(z,i)=>i===5?z.top:z.lv+Math.round(i*(z.top-1-z.lv)/4);
function fight(zi,i){
  if(BT||SV)return;
  const z=ZONES[zi],st=STORY[zi];
  if(i===0&&!S.story.seen[zi+'a']){S.story.seen[zi+'a']=1;save();showStory(st.pre,null,()=>fight(zi,i));return}
  if(i===5&&!S.story.seen[zi+'b']){S.story.seen[zi+'b']=1;save();showStory(st.boss,null,()=>fight(zi,i));return}
  const boss=i===5,lv=stageLv(z,i),name=boss?z.boss:z.mobs[STAGE_MOB[i]];
  const m=mkMonster(name,lv,boss,false);if(boss)m.skills[0].n=z.bs;
  startBattle(m,{type:'stage',zi,i,title:`${z.n} · ${boss?'首领':'第 '+(i+1)+' 战'}`});
}
function startBattle(enemy,ctx){
  const A=mkPlayer();A.side='a';enemy.side='b';
  if(ctx.prep)ctx.prep(A,enemy);
  const info=[fInfo(A),fInfo(enemy)];
  const res=simulate(A,enemy,ctx.sim||{});
  const reward=applyResult(res.win,ctx,enemy,A);
  save();
  BT={res,info,i:0,timer:null,autoT:null,ctx,reward,done:false};
  showBattle();
}
function applyResult(win,ctx,enemy,A){
  const rw=[];
  if(ctx.type==='stage'){
    const boss=ctx.i===5,lv=enemy.lv;
    if(win){
      S.kills++;track('kill');if(boss){S.stat.boss++;track('boss')}
      let e=(12+lv*6)*(boss?5:1);if(S.lv>lv+5)e*=.3;
      const g=Math.round((5+lv*3)*(boss?4:1)*R(.8,1.2)),x=(1+Math.floor(lv/4))*(boss?3:1);
      S.silver+=g;S.xw+=x;rw.push(`经验 +${Math.round(e)}`,`银两 +${g}`,`修为 +${x}`);
      if(boss||Math.random()<.25)rw.push(dropItem(lv,rollQ(boss)));
      const first=ctx.i===S.prog[ctx.zi];
      if(boss){const j=10+lv;S.jade+=j;rw.push(`魂玉 +${j}`);
        if(first||Math.random()<.15){const so=randomSoul(first?2:1);rw.push(`获得武魂 ${soulTag(so)}`)}
        if(Math.random()<.3)rw.push(addGem(pick(GEMK),1))}
      if(Math.random()<.04){S.qiyu.tok=Math.min(9,S.qiyu.tok+1);rw.push('奇遇令 +1')}
      if(first){S.prog[ctx.zi]++;rw.push('<span class="q4">首次通关</span>');
        if(boss&&ctx.zi<ZONES.length-1)rw.push(`<span class="q4">新区域开启：${ZONES[ctx.zi+1].n}</span>`);
        if(boss&&!S.story.seen[ctx.zi+'c'])S.story.pend=ctx.zi;}
      gainExp(e).forEach(m=>rw.push(`<span class="q4">${m}</span>`));
    }else rw.push('胜败乃兵家常事。去修炼、冲穴或换件好兵器再来。');
  }else if(ctx.type==='event'){
    const r=win?ctx.win():ctx.lose;logQ(ctx.title,r);rw.push(r);
  }else if(ctx.type==='arena'){
    S.arena.tries--;track('arena');
    if(win){
      S.stat.arenaWin++;const old=S.arena.rank;
      if(ctx.foe.rank<old){S.arena.rank=ctx.foe.rank;S.arena.best=Math.min(S.arena.best,S.arena.rank);rw.push(`排名 ${old} → <span class="q4">${S.arena.rank}</span>`);
        if(S.arena.rank<=10)newsPush(`【${esc(S.name)}】在论剑中击败【${ctx.foe.name}】，登上第 ${S.arena.rank} 名！`)}
      S.arena.rep+=15;rw.push('声望 +15');
    }else{S.arena.rep+=3;rw.push('虽败犹荣，声望 +3')}
  }else if(ctx.type==='tower'){
    const run=S.tower.run,f=run.floor;
    if(win){
      track('tower');S.kills++;
      if(f>S.tower.best){
        S.tower.best=f;rw.push(`<span class="q4">新纪录：第 ${f} 层</span>`);
        const g=30+f*15,x=5+f*2;S.silver+=g;S.xw+=x;rw.push(`银两 +${g}`,`修为 +${x}`);
        gainExp(12+enemy.lv*6).forEach(m=>rw.push(`<span class="q4">${m}</span>`));
        if(f%5===0){const j=10+f;S.jade+=j;rw.push(`魂玉 +${j}`)}
        if(f%10===0){rw.push(addGem(pick(GEMK),Math.min(5,1+Math.floor(f/20))));S.fruit+=2;rw.push('灵果 +2');const so=randomSoul(f>=40?3:2);rw.push(`获得武魂 ${soulTag(so)}`);
          newsPush(`【${esc(S.name)}】击败${enemy.name}，登上通天塔第 ${f} 层！`)}
      }else rw.push(`闯过第 ${f} 层`);
      run.hp=Math.min(1,A.hp/A.maxhp+.15+run.b.regen);run.floor++;run.n++;
      if(run.n%3===0)run.picks=shuffle(TOWER_BUFFS).slice(0,3).map(b=>TOWER_BUFFS.indexOf(b));
    }else{S.tower.run=null;rw.push(`止步第 ${f} 层。下次再来。`)}
  }else if(ctx.type==='escort'){
    const run=S.escort.run,g=ESC[run.g];
    if(win){run.log.push(`${ESC_SEG[run.seg]}：击退了劫镖的${enemy.name}`);run.seg++;rw.push(`击退劫镖的${esc(enemy.name)}`);
      if(run.seg>=3)rw.push(...escComplete());else rw.push(`镖车继续前行（${run.seg}/3）`)}
    else{const dep=g.dep*S.lv;S.escort.run=null;S.escort.last=`${g.n}在${ESC_SEG[run.seg]}被劫，押金 ${fmt(dep)} 两打了水漂。`;rw.push(S.escort.last)}
  }else if(ctx.type==='wb'){
    const dmg=ctx.start-enemy.hp;S.wb.hp=enemy.hp;S.wb.tries--;S.wb.dmg+=dmg;track('wb');
    const g=Math.round(dmg/S.wb.max*S.lv*300)+S.lv*20;S.silver+=g;S.gx+=15;
    rw.push(`造成伤害 ${fmt(dmg)}（${(dmg/S.wb.max*100).toFixed(1)}%）`,`银两 +${fmt(g)}`,'贡献 +15');
    if(enemy.hp<=0){S.wb.killed=true;S.stat.wbKill++;S.gx+=100;S.fruit+=3;
      rw.push('<span class="q4">首领已被击杀</span>',`获得武魂 ${soulTag(randomSoul(3))}`,addGem(pick(GEMK),2,2),'灵果 +3','贡献 +100');
      newsPush(`【${esc(S.name)}】击杀世界首领「${WBS[S.wb.idx].n}」，威震江湖！`)}
  }
  return rw;
}
function showBattle(){
  const [ia,ib]=BT.info;
  const ov=document.createElement('div');ov.className='ov';ov.id='ov';
  const fh=(f,s)=>`<div class="f-name"><b>${esc(f.name)}</b><span class="tag">${f.tag} · ${f.lv} 级</span></div>
    <div class="bar hp"><i id="${s}-hp"></i></div><div class="bar-n" id="${s}-hpn"></div><div class="bar mp"><i id="${s}-mp"></i></div><div class="fx-tags" id="${s}-tags"></div>`;
  ov.innerHTML=`<div class="bt" role="dialog" aria-modal="true" aria-label="战斗">

function btApply(e,withLog){
  const set=(s,v,inf,tags)=>{
    $(`#${s}-hp`).style.width=(v[0]/inf.maxhp*100)+'%';
    $(`#${s}-hpn`).textContent=`${fmt(v[0])} / ${fmt(inf.maxhp)}`;
    $(`#${s}-mp`).style.width=(v[1]/inf.maxmp*100)+'%';
    $(`#${s}-tags`).innerHTML=tags.map(t=>`<span>${t}</span>`).join('');
  };
  set('a',e.a,BT.info[0],e.ta);set('b',e.b,BT.info[1],e.tb);
  if(e.round)$('#bt-round').textContent=`第 ${e.round} 回合`;
  if(withLog){
    const lg=$('#blog');const p=document.createElement('p');p.innerHTML=e.text;lg.appendChild(p);lg.scrollTop=lg.scrollHeight;
    for(const f of e.fx){const el=document.createElement('span');el.className='pop '+f.k;el.textContent=f.v;$('#f'+f.on).appendChild(el);setTimeout(()=>el.remove(),900)}
  }
}
function btSkip(){
  if(!BT||BT.done)return;clearInterval(BT.timer);
  const lg=$('#blog');let html='';for(let i=BT.i+1;i<BT.res.log.length;i++)html+=`<p>${BT.res.log[i].text}</p>`;
  lg.insertAdjacentHTML('beforeend',html);lg.scrollTop=lg.scrollHeight;
  btApply(BT.res.log[BT.res.log.length-1],false);
  const lr=[...BT.res.log].reverse().find(e=>e.round);if(lr)$('#bt-round').textContent=`第 ${lr.round} 回合`;

function btEnd(){
  clearInterval(BT.timer);BT.done=true;

/* ============ 论剑 ============ */
function arenaFoe(rank){
  const s1=seeded(rank),s2=seeded(rank+7777),s3=seeded(rank+3333),str=(1000-rank)/1000;
  return {rank,name:SUR[Math.floor(s1*SUR.length)]+GIV[Math.floor(s2*GIV.length)],sect:SECT_KEYS[Math.floor(s3*7)],lv:clamp(S.lv+Math.round(str*4+s1*2-2),1,60),m:.75+str*.3};
}
const foePower=f=>powerOf(mkNPC(f.name,f.sect,f.lv,f.m));
const arenaReward=()=>({rep:Math.max(20,Math.round(300-S.arena.rank*.3)),silver:Math.round((1000-S.arena.rank)*.5+S.lv*20)});

/* ============ 通天塔 ============ */
const towerCP=()=>S.tower.best>=10?Math.floor(S.tower.best/10)*10+1:1;
function towerEnemy(f){const boss=f%10===0;const name=boss?TOWER_BOSS[(f/10-1)%TOWER_BOSS.length]:TOWER_MOB[f%TOWER_MOB.length];return mkMonster(name,f+4,boss,!boss&&f%5===0)}
function towerFight(){
  const run=S.tower.run;if(!run||run.picks||BT)return;
  const f=run.floor,m=towerEnemy(f);
  startBattle(m,{type:'tower',title:`通天塔 · 第 ${f} 层`,prep:towerPrep(run)});
}

/* ============ 押镖 ============ */
function escComplete(){
  const run=S.escort.run,g=ESC[run.g],rw=[];
  const sil=(g.dep+g.rw)*S.lv;S.silver+=sil;S.gx+=20;rw.push(`<span class="q4">镖车平安抵达</span>`,`银两 +${fmt(sil)}（含押金）`,'贡献 +20');
  if(run.g===2)rw.push(addGem(pick(GEMK),2));else if(Math.random()<(run.g?.5:.2))rw.push(addGem(pick(GEMK),1));
  if(run.g>0){S.fruit+=1;rw.push('灵果 +1')}
  S.stat.escort++;track('escort');
  S.escort.last=`${g.n}平安抵达，获利 ${fmt(g.rw*S.lv)} 两。`;S.escort.run=null;
  return rw;
}

/* ============ 世界首领 ============ */
function ensureWB(){
  if(S.wb&&S.wb.day===today())return;
  const d=today(),idx=[...d].reduce((s,c)=>s+c.charCodeAt(0),0)%WBS.length,b=WBS[idx];
  const max=Math.round(mkNPC(b.n,b.s,S.lv+2,1.1).maxhp*1.8);
  S.wb={day:d,idx,max,hp:max,tries:3,killed:false,dmg:0};
}

/* ============ 每日 ============ */
function genTasks(){S.sm.day=today();S.sm.bonus=false;S.sm.tasks=shuffle(Object.keys(TASKS)).slice(0,4).map(t=>({t,need:TASKS[t].need,cur:0,got:false}))}
function checkDaily(){
  const d=today();
  if(S.sm.day!==d)genTasks();
  if(S.online.day!==d)S.online={day:d,sec:0,got:0};
  if(S.day!==d){S.day=d;S.arena.tries=10;S.arena.claimed=false;S.qiyu.tok=Math.min(9,S.qiyu.tok+3);S.escort.left=3;save();toast('新的一天：论剑、押镖次数已重置，奇遇令 +3，师门任务已刷新')}
}
function checkAch(){
  for(const a of ACHS)if(!S.titles.includes(a.id)&&a.t()){S.titles.push(a.id);if(!S.title)S.title=a.id;toast(`获得称号 <span class="q4">「${a.n}」</span>`);save()}
}

      <div class="row">${en>=15?'<span class="q4">已强化至 +15</span>':`<button class="btn sm pri" data-a="enhance" data-v="${sl}" ${S.silver<cost?'disabled':''}>强化 +${en+1}（${Math.round(rate*100)}% · 银两 ${fmt(cost)}）</button><button class="btn sm" data-a="enhanceTo" data-v="${sl}" ${S.silver<cost?'disabled':''}>一键强化至 +${en<10?10:15}</button>`}
        ${it.q>=2&&!it.toy?`<button class="btn sm" data-a="reforge" data-v="${sl}" ${S.silver<reforgeCost(it)||rf?'disabled':''}>洗练（银两 ${fmt(reforgeCost(it))}）</button>`:''}
        <button class="btn sm" data-a="unequip" data-v="${sl}">卸下</button></div>

     :'<p class="empty">还没有宝石。首领、通天塔、押镖、世界首领、师门商店都能得到。</p>'}</section>

    ${sellAllArm&&S.bag.length?`<button class="btn red" data-a="sellAll" id="sellall-ok">确认：卖掉行囊里全部 ${S.bag.length} 件，得银两 ${fmt(S.bag.reduce((s,i)=>s+sellPrice(i),0))}</button><button class="btn" data-a="sellAllCancel">取消</button>`
     :`<button class="btn red" data-a="sellAll" ${S.bag.length?'':'disabled'}>全部出售（${S.bag.length} 件）</button>`}</div>

/* ============ 操作 ============ */
const ACT={
  tab(v){S.tab=v;resetArm=false;rbArm=false;gemPick=null;save();render();window.scrollTo({top:0})},
  pickSect(v){window._cname=$('#cname').value;CS=v;render()},
  randName(){window._cname=randName();render()},
  create(){const n=($('#cname').value||'').trim().slice(0,8)||randName();S=newGame(n,CS);
    S.equip.wpn=mkItem(1,1,'wpn');genTasks();save();render();toast(`${esc(n)} 拜入${SECTS[CS].n}，踏入江湖`)},
  zone(v){S.zSel=+v;save();render()},
  fight(v){const [z,i]=v.split(',').map(Number);fight(z,i)},
  replay(v){const z=+v,s=STORY[z],L=[...s.pre];if(S.story.seen[z+'b'])L.push(...s.boss);if(S.story.seen[z+'c'])L.push(...s.post);showStory(L,null,null)},
  autoT(_,el){S.auto=el.checked;save()},
  tAutoT(_,el){S.tAuto=el.checked;save()},
  fastT(_,el){S.fast=el.checked;save()},
  autoStop(){S.auto=false;S.tAuto=false;save();if(BT){clearTimeout(BT.autoT);const b=$('#bt-foot');if(b)b.querySelectorAll('[data-a=autoStop],.muted').forEach(x=>x.remove())}},
  btSkip(){btSkip()},
  btClose(){closeBattle()},
  stNext(){storyNext()},
  stPick(v){storyPick(+v)},
  collect(){const p=cultPending();if(p.exp<1&&p.xw<1){toast('刚刚收过功，再坐一会儿吧');return}
    S.cult.last=Date.now();S.xw+=p.xw;const ms=gainExp(p.exp);track('collect');save();render();toast(`收功：经验 +${fmt(p.exp)}，修为 +${fmt(p.xw)}`);ms.forEach(toast)},
  xinfa(){const c=xfCost();if(S.silver<c||S.cult.xf>=xfCap())return;
    const p=cultPending();S.cult.last=Date.now();S.xw+=p.xw;const ms=gainExp(p.exp); // 先按旧层数结算
    S.silver-=c;S.cult.xf++;save();render();toast(`心法精进至第 ${S.cult.xf} 层`);ms.forEach(toast)},
  train(k){const n=S.train[k],c=trainCost(n);if(S.silver<c||n>=S.lv*2)return;S.silver-=c;S.train[k]++;save();render()},
  mer(k){const t=S.mer[k];if(t>=40)return;const l=Math.floor(t/8),c=merCost(t);if(S.lv<MER_REQ[l]||S.xw<c)return;
    const pts=k==='ren'?REN:DU;track('mer');
    if(Math.random()<MER_RATE[l]){S.xw-=c;S.mer[k]++;toast(`冲开「${pts[t%8]}」穴`);
      if(S.mer[k]%8===0)toast(`<span class="q4">${k==='ren'?'任':'督'}脉第${LAYER[l]}重圆满</span>`);
      if(S.mer[k]%8===0&&meridianBonus().tong===l+1)toast(`<span class="q4">任督二脉贯通第${LAYER[l]}重，全属性提升</span>`);}
    else{const lost=Math.ceil(c/2);S.xw-=lost;toast(`真气逆行，冲穴失败，损失修为 ${lost}`)}
    save();render()},
  soulEq(u){const i=S.soulSlots.findIndex((x,j)=>!x&&soulSlotOpen(j));if(i<0)return;S.soulSlots[i]=u;save();render()},
  soulUn(i){S.soulSlots[+i]=null;save();render()},
  soulUp(u){const so=S.souls.find(x=>x.uid===u);if(!so||so.lv>=10)return;const c=Math.round(10*SOULDEF[so.id].r*so.lv);if(S.jade<c)return;S.jade-=c;so.lv++;save();render();toast(`${SOULDEF[so.id].n}升至 ${so.lv} 级`)},
  soulDis(u){const so=S.souls.find(x=>x.uid===u);if(!so||S.soulSlots.includes(u))return;const g=5*SOULDEF[so.id].r*so.lv;S.jade+=g;S.souls=S.souls.filter(x=>x.uid!==u);save();render();toast(`炼化${SOULDEF[so.id].n}，魂玉 +${g}`)},
  qiyuGo(){if(S.qiyu.tok<1||S.qiyu.cur!==null)return;S.qiyu.tok--;let i;do{i=Math.floor(Math.random()*QIYU.length)}while(i===S.qiyu.last&&QIYU.length>1);S.qiyu.cur=i;S.qiyu.last=i;save();render()},
  qiyuCh(v){const ev=QIYU[S.qiyu.cur];if(!ev)return;const ch=ev.ch[+v];const cost=ch.cost?ch.cost():0;if(S.silver<cost)return;S.silver-=cost;S.qiyu.cur=null;
    S.stat.qiyu++;track('qiyu');
    const r=ch.fn();
    if(r&&typeof r==='object'&&r.battle){save();render();startBattle(r.battle,{type:'event',title:ev.t,win:r.win,lose:r.lose});return}
    logQ(ev.t,r);save();render();toast(ev.t+'：'+r)},
  arenaFight(v){if(S.arena.tries<1||BT)return;const f=arenaFoe(+v);startBattle(mkNPC(f.name,f.sect,f.lv,f.m),{type:'arena',foe:f,title:`论剑 · 挑战第 ${f.rank} 名`})},
  arenaClaim(){if(S.arena.claimed)return;const r=arenaReward();S.arena.claimed=true;S.arena.rep+=r.rep;S.silver+=r.silver;save();render();toast(`领取俸禄：声望 +${r.rep}，银两 +${fmt(r.silver)}`)},
  shop(k){const w=SHOP.find(x=>x.k===k);if(!w||S.arena.rep<w.p)return;
    if(k==='box'&&S.bag.length>=40){toast('行囊已满，先清理一下');return}
    S.arena.rep-=w.p;let m='';
    if(k==='soul'){const so=randomSoul(2);m=`获得武魂 ${soulTag(so)}`}
    if(k==='jade'){S.jade+=60;m='魂玉 +60'}
    if(k==='tok'){S.qiyu.tok++;m='奇遇令 +1'}
    if(k==='box')m=dropItem(S.lv,3);
    save();render();toast(m)},
  /* 通天塔 */
  towerStart(v){if(S.tower.run)return;const f=+v;if(f!==1&&f!==towerCP())return;
    S.tower.run={floor:f,hp:1,n:0,picks:null,got:[],b:{atk:0,def:0,hp:0,crit:0,dodge:0,spd:0,steal:0,regen:0}};save();render()},
  towerFight(){towerFight()},
  towerPick(v){const run=S.tower.run;if(!run||!run.picks)return;const b=TOWER_BUFFS[+v];
    if(b.k==='heal')run.hp=Math.min(1,run.hp+b.v);else run.b[b.k]+=b.v;run.got.push(b.n);run.picks=null;save();render();
    if(S.tAuto)setTimeout(()=>{if(S.tAuto&&S.tower.run&&!S.tower.run.picks&&!BT)towerFight()},400)},
  towerQuit(){if(!S.tower.run)return;const f=S.tower.run.floor;S.tower.run=null;save();render();toast(`你在第 ${f} 层前收手离开`)},
  /* 师门 */
  smClaim(v){const x=S.sm.tasks[+v];if(!x||x.got||x.cur<x.need)return;x.got=true;S.gx+=50;const g=S.lv*40;S.silver+=g;save();render();toast(`贡献 +50，银两 +${fmt(g)}`)},
  smBonus(){if(S.sm.bonus||S.sm.tasks.filter(x=>x.got).length<4)return;S.sm.bonus=true;S.gx+=100;const t=addGem(pick(GEMK),1);save();render();toast(`全勤奖：贡献 +100，${t}`)},
  secret(){if(!secretOpen()||S.secret>=5)return;const c=S.secret?600*S.secret:800;if(S.gx<c)return;S.gx-=c;S.secret++;save();render();
    toast(S.secret===1?`习得秘传「${SECTS[S.sect].secret.n}」`:`「${SECTS[S.sect].secret.n}」修至第${CN[S.secret]}重`)},
  smShop(k){const w=SM_SHOP.find(x=>x.k===k);if(!w||S.gx<w.p)return;S.gx-=w.p;let m='';
    if(k==='gem')m=addGem(pick(GEMK),1);if(k==='gem2')m=addGem(pick(GEMK),2);if(k==='fruit'){S.fruit+=5;m='灵果 +5'}if(k==='tok'){S.qiyu.tok++;m='奇遇令 +1'}
    save();render();toast(m)},
  /* 活动 */
  escStart(v){const g=ESC[+v],dep=g.dep*S.lv;if(S.escort.run||S.escort.left<1||S.silver<dep)return;S.silver-=dep;S.escort.left--;
    S.escort.run={g:+v,seg:0,log:[`交了押金 ${fmt(dep)} 两，押着${g.n}出发了。`]};save();render()},
  escGo(){const run=S.escort.run;if(!run||BT)return;const g=ESC[run.g];
    if(Math.random()<g.risk){const name=pick(ROBBERS);startBattle(mkNPC(name,pick(SECT_KEYS),S.lv,g.m+R(-.05,.08),'劫镖'),{type:'escort',title:`押镖 · ${ESC_SEG[run.seg]}`});return}
    const r=Math.random();let t;
    if(r<.2){const x=Math.round(S.lv*15);S.silver+=x;t=`拾到一个钱袋，银两 +${x}`}else t=pick(['一路无事。','在路边茶摊歇了歇脚。','遇到一队商旅，结伴而行。','山风很大，镖旗猎猎作响。']);
    run.log.push(`${ESC_SEG[run.seg]}：${t}`);run.seg++;
    if(run.seg>=3){const rw=escComplete();save();render();toast(rw.join('，'))}else{save();render()}},
  wbFight(){ensureWB();const W=S.wb;if(W.tries<1||W.killed||BT)return;
    startBattle(mkWB(),{type:'wb',title:`世界首领 · ${WBS[W.idx].n}`,sim:{rounds:10,wb:true},start:W.hp})},
  /* 福利 */
  signIn(){const t=doSign();if(!t)return;save();render();toast(t)},
  online(){const m=doOnline();if(!m)return;save();render();toast(`在线宝箱：${m}`)},
  /* 一键 */
  sweep(v){if(BT||SV)return;const [zi,i]=v.split(',').map(Number);if(i>=S.prog[zi])return;
    const z=ZONES[zi],boss=i===5,lv=stageLv(z,i),name=boss?z.boss:z.mobs[STAGE_MOB[i]],a=snap();let w=0,l=0;
    for(let k=0;k<10;k++){const m=mkMonster(name,lv,boss,false);if(boss)m.skills[0].n=z.bs;if(quickBattle(m,{type:'stage',zi,i}).win)w++;else{l++;break}}
    save();render();toast(`扫荡${name}：胜 ${w} 场${l?'，落败一场，已停止':''}。${diffTxt(a)}`)},
  towerQuick(){const run=S.tower.run;if(!run||run.picks||BT)return;const f0=run.floor,a=snap();let n=0;
    while(S.tower.run&&!S.tower.run.picks){const r=S.tower.run;if(quickBattle(towerEnemy(r.floor),{type:'tower',prep:towerPrep(r)}).win)n++}
    save();render();toast((S.tower.run?`连闯 ${n} 层，到第 ${S.tower.run.floor} 层，请选择增益。`:`连闯 ${n} 层，止步第 ${f0+n} 层。`)+diffTxt(a))},
  escAll(){const run=S.escort.run;if(!run||BT)return;const g=ESC[run.g],a=snap();
    while(S.escort.run){const r=S.escort.run;
      if(Math.random()<g.risk)quickBattle(mkNPC(pick(ROBBERS),pick(SECT_KEYS),S.lv,g.m+R(-.05,.08),'劫镖'),{type:'escort'});
      else{r.log.push(`${ESC_SEG[r.seg]}：一路无事。`);r.seg++;if(r.seg>=3)escComplete()}}
    save();render();toast(`${S.escort.last} ${diffTxt(a)}`)},
  wbAll(){ensureWB();if(BT||S.wb.tries<1||S.wb.killed)return;const a=snap();let n=0;
    while(S.wb.tries>0&&!S.wb.killed){quickBattle(mkWB(),{type:'wb',sim:{rounds:10,wb:true},start:S.wb.hp});n++}
    save();render();toast(`挑战世界首领 ${n} 次${S.wb.killed?'，首领已被击杀':''}。${diffTxt(a)}`)},
  arenaAll(){if(BT||S.arena.tries<1)return;const a=snap(),r0=S.arena.rank;let w=0,l=0;
    while(S.arena.tries>0){
      const step=Math.max(1,Math.round(S.arena.rank/25)),foes=[1,2,3,4,5].map(i=>S.arena.rank-i*step).filter(r=>r>=1).map(arenaFoe);if(!foes.length)break;
      const p=calcStats().power,f=[...foes].reverse().find(f=>foePower(f)<=p*.95)||foes[0]; // 挑能稳赢的里面排名最高的
      if(quickBattle(mkNPC(f.name,f.sect,f.lv,f.m),{type:'arena',foe:f}).win)w++;else l++}
    save();render();toast(`论剑 ${w+l} 场：胜 ${w}，败 ${l}，排名 ${r0} → ${S.arena.rank}。${diffTxt(a)}`)},
  merAll(){const a=snap();let ok=0,fail=0;
    for(;;){const k=['ren','du'].filter(k=>{const t=S.mer[k];return t<40&&S.lv>=MER_REQ[Math.floor(t/8)]&&S.xw>=merCost(t)}).sort((x,y)=>merCost(S.mer[x])-merCost(S.mer[y]))[0];if(!k)break;
      const t=S.mer[k],c=merCost(t);track('mer');if(Math.random()<MER_RATE[Math.floor(t/8)]){S.xw-=c;S.mer[k]++;ok++}else{S.xw-=Math.ceil(c/2);fail++}}
    if(!ok&&!fail){toast('修为不够，或已冲到当前等级的上限');return}
    save();render();toast(`冲穴 ${ok+fail} 次：成功 ${ok}，失败 ${fail}。${diffTxt(a)}`)},
  trainAll(){let n=0;
    for(;;){const k=TRAIN.map(t=>t.k).filter(k=>S.train[k]<S.lv*2&&S.silver>=trainCost(S.train[k])).sort((x,y)=>trainCost(S.train[x])-trainCost(S.train[y]))[0];if(!k)break;S.silver-=trainCost(S.train[k]);S.train[k]++;n++}
    if(!n){toast('银两不够，或已全部修满');return}save();render();toast(`属性修炼共提升 ${n} 级`)},
  trainMax(k){let n=0;while(S.train[k]<S.lv*2&&S.silver>=trainCost(S.train[k])){S.silver-=trainCost(S.train[k]);S.train[k]++;n++}if(n){save();render();toast(`修炼 ${n} 级`)}},
  xinfaAll(){if(S.cult.xf>=xfCap()||S.silver<xfCost())return;
    const p=cultPending();S.cult.last=Date.now();S.xw+=p.xw;const ms=gainExp(p.exp);let n=0;
    while(S.cult.xf<xfCap()&&S.silver>=xfCost()){S.silver-=xfCost();S.cult.xf++;n++}
    save();render();toast(`心法连升 ${n} 层，现为第 ${S.cult.xf} 层`);ms.forEach(toast)},
  soulMax(u){const so=S.souls.find(x=>x.uid===u);if(!so)return;const r=SOULDEF[so.id].r;let n=0;
    while(so.lv<10&&S.jade>=Math.round(10*r*so.lv)){S.jade-=Math.round(10*r*so.lv);so.lv++;n++}if(n){save();render();toast(`${SOULDEF[so.id].n}连升 ${n} 级`)}},
  soulBest(){const list=[...S.souls].sort((a,b)=>soulRank(b)-soulRank(a));let j=0;S.soulSlots=S.soulSlots.map((u,i)=>soulSlotOpen(i)?(list[j++]?.uid||null):null);save();render();toast('已装配最强的武魂')},
  petMax(id){const p=S.pets.find(x=>x.id===id);if(!p)return;let n=0;while(p.lv<PET_MAX&&S.fruit>=Math.ceil(p.lv/3)){S.fruit-=Math.ceil(p.lv/3);p.lv++;n++}if(n){save();render();toast(`${PETS[id].n}连升 ${n} 级`)}},
  enhanceTo(sl){const it=S.equip[sl];if(!it)return;const target=(it.en||0)<10?10:15;let n=0;
    while((it.en||0)<target&&S.silver>=enCost(it)){const en=it.en||0;S.silver-=enCost(it);track('enhance');n++;if(Math.random()<EN_RATE[en])it.en=en+1;else if(en>=7)it.en=en-1}
    if(!n)return;S.stat.enMax=Math.max(S.stat.enMax,it.en||0);if(it.en>=10)newsPush(`恭喜玩家【${esc(S.name)}】将${esc(it.name)}强化至 +${it.en}！`);
    save();render();toast(`强化 ${n} 次，${itemTag(it)}${(it.en||0)<target?'，银两用完了':''}`)},
  gemMixAll(){let n=0;
    for(let l=1;l<5;l++)for(const k of GEMK){const key=k+l;while(S.gems[key]>=3&&S.silver>=100*l){S.gems[key]-=3;S.silver-=100*l;S.gems[k+(l+1)]=(S.gems[k+(l+1)]||0)+1;n++}}
    if(!n){toast('没有能合成的宝石');return}save();render();toast(`合成 ${n} 次`)},
  gemAuto(){let n=0;
    for(const sl of SLOTS){const it=S.equip[sl];if(!it)continue;const gm=sockets(it);
      for(let i=0;i<gm.length;i++){const best=Object.keys(S.gems).filter(k=>S.gems[k]>0).sort((a,b)=>gemPow(b)-gemPow(a))[0];if(!best)break;
        if(!gm[i]){gm[i]=best;S.gems[best]--;n++}else if(gemPow(best)>gemPow(gm[i])){S.gems[gm[i]]=(S.gems[gm[i]]||0)+1;gm[i]=best;S.gems[best]--;n++}}}
    gemPick=null;if(!n){toast('没有更好的宝石可镶');return}save();render();toast(`镶嵌了 ${n} 颗宝石`)},
  equipBest(){let n=0;
    for(const sl of SLOTS){const best=S.bag.filter(i=>i.slot===sl).sort((a,b)=>itemPower(b)-itemPower(a))[0];
      if(best&&itemPower(best)>itemPower(S.equip[sl])){S.bag=S.bag.filter(x=>x!==best);if(S.equip[sl])S.bag.push(S.equip[sl]);S.equip[sl]=best;n++}}
    S.reforge=null;gemPick=null;if(!n){toast('身上已经是最好的了');return}save();render();toast(`换上了 ${n} 件更好的装备`)},
  smAll(){const r=doSmClaims();if(!r.n&&!r.t){toast('没有可领取的任务');return}save();render();toast(`领取 ${r.n} 个任务奖励${r.t?`，全勤奖 ${r.t}`:''}`)},
  dailyAll(){const a=snap(),o=[];
    const s=doSign();if(s)o.push('签到');
    let c=0;while(doOnline())c++;if(c)o.push(`在线宝箱 ${c} 个`);
    const p=cultPending();if(p.exp>=1||p.xw>=1){S.cult.last=Date.now();S.xw+=p.xw;gainExp(p.exp);track('collect');o.push('打坐收功')}
    if(!S.arena.claimed){const r=arenaReward();S.arena.claimed=true;S.arena.rep+=r.rep;S.silver+=r.silver;o.push('论剑俸禄')}
    const m=doSmClaims();if(m.n)o.push(`师门任务 ${m.n} 个`);if(m.t)o.push('师门全勤奖');
    if(!o.length){toast('今天能领的都领过了');return}
    save();render();toast(`已领取：${o.join('、')}。${diffTxt(a)}`)},
  shouchong(){if(SV||BT)return;S.stat.sc++;const L=[['师父',SC_LINES[Math.min(S.stat.sc,SC_LINES.length)-1]]];
    if(S.stat.sc===1){const it={uid:uid(),slot:'wpn',q:4,ilv:1,name:'屠龙宝刀（玩具）',st:{atk:1},en:0,gm:[null,null,null],toy:true};
      if(S.bag.length<40){S.bag.push(it);L.push(['旁白','师父训完话，从床底下摸出一把木头刀扔给你。你获得了「屠龙宝刀（玩具）」，攻击 +1。'])}}
    save();showStory(L,null,()=>render())},
  /* 灵兽 */
  petAdopt(id){const p=PETS[id];if(S.pets.some(x=>x.id===id)||!petOpen(id)||S.silver<p.cost)return;S.silver-=p.cost;S.pets.push({id,lv:1});if(!S.pet)S.pet=id;save();render();toast(`${p.n}成了你的伙伴`)},
  petGo(id){if(!S.pets.some(x=>x.id===id))return;S.pet=id;save();render()},
  petRest(){S.pet=null;save();render()},
  petFeed(id){const p=S.pets.find(x=>x.id===id);if(!p||p.lv>=PET_MAX)return;const c=Math.ceil(p.lv/3);if(S.fruit<c)return;S.fruit-=c;p.lv++;save();render();toast(`${PETS[id].n}升至 ${p.lv} 级`)},
  buyFruit(v){const n=+v,c=300*n;if(S.silver<c)return;S.silver-=c;S.fruit+=n;save();render()},
  /* 称号与转生 */
  wearTitle(id){if(!S.titles.includes(id))return;S.title=id;save();render()},
  rbSect(k){RBS=k;rbArm=false;render()},
  rebirth(){if(S.lv<60||S.rb>=5)return;if(!rbArm){rbArm=true;render();return}rbArm=false;
    const ns=RBS||S.sect;S.rb++;S.sect=ns;S.lv=1;S.exp=0;S.mer={ren:0,du:0};S.train={hp:0,mp:0,atk:0,def:0};S.prog=[0,0,0,0,0,0,0];S.zSel=0;S.cult={last:Date.now(),xf:1};S.tower.run=null;
    RBS=null;S.tab='jianghu';save();render();newsPush(`【${esc(S.name)}】完成${CN[S.rb]}转，改投${SECTS[ns].n}门下！`);
    showStory([['旁白',`你散去一身功力，从头练起。这一次，你是${SECTS[ns].n}弟子。`],['旁白',`${CN[S.rb]}转完成：门派基础属性与成长 +${S.rb*20}%。`]],null,()=>render())},
  /* 装备 */
  equip(u){const it=S.bag.find(x=>x.uid===u);if(!it)return;const old=S.equip[it.slot];S.bag=S.bag.filter(x=>x.uid!==u);if(old)S.bag.push(old);S.equip[it.slot]=it;S.reforge=null;gemPick=null;save();render();toast(`装备 ${itemTag(it)}`)},
  unequip(sl){const it=S.equip[sl];if(!it)return;if(S.bag.length>=40){toast('行囊已满');return}S.bag.push(it);S.equip[sl]=null;S.reforge=null;gemPick=null;save();render()},
  sell(u){const it=S.bag.find(x=>x.uid===u);if(!it)return;stripGems(it);S.silver+=sellPrice(it);S.bag=S.bag.filter(x=>x.uid!==u);save();render();toast(`售出，银两 +${fmt(sellPrice(it))}${(it.gm||[]).length?'，宝石已取回':''}`)},
  sellAll(){if(!S.bag.length)return;if(!sellAllArm){sellAllArm=true;render();const b=$('#sellall-ok');if(b)b.focus({preventScroll:true});return}
    sellAllArm=false;const n=S.bag.length;let g=0,gems=0;
    for(const it of S.bag){gems+=(it.gm||[]).filter(Boolean).length;stripGems(it);g+=sellPrice(it)}
    S.bag=[];S.silver+=g;save();render();toast(`卖掉 ${n} 件装备，银两 +${fmt(g)}${gems?`，取回宝石 ${gems} 颗`:''}`)},
  sellAllCancel(){sellAllArm=false;render()},
  sellLow(){const low=S.bag.filter(i=>i.q<=1&&!i.en&&!(i.gm||[]).some(Boolean));const g=low.reduce((s,i)=>s+sellPrice(i),0);S.bag=S.bag.filter(i=>!low.includes(i));S.silver+=g;save();render();toast(`售出 ${low.length} 件，银两 +${fmt(g)}`)},
  enhance(sl){const it=S.equip[sl];if(!it)return;const en=it.en||0;if(en>=15)return;const c=enCost(it);if(S.silver<c)return;S.silver-=c;track('enhance');
    if(Math.random()<EN_RATE[en]){it.en=en+1;S.stat.enMax=Math.max(S.stat.enMax,it.en);toast(`强化成功：${itemTag(it)}`);if(it.en>=10)newsPush(`恭喜玩家【${esc(S.name)}】将${esc(it.name)}强化至 +${it.en}！`)}
    else if(en>=7){it.en=en-1;toast(`强化失败，${esc(it.name)} 掉到 +${it.en}`)}else toast('强化失败，银两打了水漂');
    save();render()},
  reforge(sl){const it=S.equip[sl];if(!it||it.q<2||it.toy)return;const c=reforgeCost(it);if(S.silver<c)return;S.silver-=c;
    S.reforge={uid:it.uid,st:rollExtras(mainStats(it.slot,it.q,it.ilv),it.q,it.ilv)};save();render()},
  rfKeep(v){const rf=S.reforge;if(!rf)return;const it=SLOTS.map(s=>S.equip[s]).find(x=>x&&x.uid===rf.uid);if(it&&v==='new')it.st=rf.st;S.reforge=null;save();render()},
  gemSlot(v){const [sl,i]=v.split(',');gemPick={sl,i:+i};render()},
  gemCancel(){gemPick=null;render()},
  gemPut(k){if(!gemPick||!(S.gems[k]>0))return;const it=S.equip[gemPick.sl];if(!it)return;const gm=sockets(it);if(gm[gemPick.i])return;gm[gemPick.i]=k;S.gems[k]--;gemPick=null;save();render()},
  gemOut(v){const [sl,i]=v.split(',');const it=S.equip[sl];if(!it)return;const gm=sockets(it),g=gm[+i];if(!g)return;gm[+i]=null;S.gems[g]=(S.gems[g]||0)+1;save();render()},
  gemMix(k){const l=+k.slice(-1);if(l>=5||!(S.gems[k]>=3)||S.silver<100*l)return;S.gems[k]-=3;S.silver-=100*l;const t=addGem(k.slice(0,-1),l+1);save();render();toast(`合成 ${t}`)},
  /* 存档 */
  reset(){if(!resetArm){resetArm=true;render();return}resetArm=false;try{localStorage.removeItem(SAVE_KEY)}catch(e){}S=null;window._cname=null;render()},
  exportSave(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const box=$('#savebox');box.value=code;box.select();
    if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>toast('存档码已复制'),()=>toast('请手动复制上方存档码'));else toast('请手动复制上方存档码')},
  importSave(){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#savebox').value.trim()))));if(!o||!SECTS[o.sect]||!o.name)throw 0;S=migrate(o);save();render();toast('存档已导入')}catch(e){toast('存档码无效，请检查是否完整复制')}},
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(b.dataset.a!=='sellAll')sellAllArm=false; // 点了别的按钮就撤销"全部出售"的待确认状态
  const f=ACT[b.dataset.a];if(f)f(b.dataset.v,b);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='cname')ACT.create();
  if(e.key==='Escape'&&BT){if(BT.done)closeBattle();else btSkip()}
});
setInterval(()=>{
  if(!S)return;
  if(document.visibilityState==='visible'){S.online.sec+=5;if(S.online.sec%60===0)save()}
  const el=$('#cult-live');if(el)el.innerHTML=cultLive();
  const ol=$('#online-live');if(ol){const t=onlineLive();if(ol.textContent!==t){ol.textContent=t;if(onlineReady()&&!BT&&!SV)render()}}
  if(S.day!==today()&&!BT&&!SV)render();
},5000);
$('#news-t').addEventListener('animationiteration',fillNews);

/* ============ 启动 ============ */
function start(data){
  S=(data&&data.save)?migrate(data.save):load();
  fillNews();render();
  if(S)storyPending();
}
window.claude?.hot?.snapshot?.(()=>({save:S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
